<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Payment | Ayan Photography</title>
  <link rel="icon" type="image/png" href="assets/ayan-logo-icon.png">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef5ff;background:#07111f;}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,rgba(72,146,255,.14),transparent 38%),linear-gradient(145deg,#0a1828,#050c15);padding:24px}main{width:min(720px,100%);padding:38px;border:1px solid rgba(124,179,241,.2);border-radius:28px;background:rgba(11,25,42,.92);box-shadow:0 26px 80px rgba(0,0,0,.35);text-align:center}.logo{width:78px;height:78px;object-fit:contain;margin-bottom:16px}.eyebrow{color:#75b2ff;font-size:11px;letter-spacing:.16em;font-weight:800}.icon{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:18px auto;font-size:35px;background:rgba(56,190,119,.12);border:1px solid rgba(82,212,144,.28)}h1{font-size:32px;margin:0 0 12px}p{color:#9eacc0;line-height:1.8;margin:0 auto;max-width:540px}.status{margin-top:18px;min-height:54px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.035);color:#dce8f7;font-size:13px;padding:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}a,button{font:inherit;text-decoration:none;border:0;border-radius:14px;padding:13px 18px;cursor:pointer}.primary{background:#4d96ff;color:#fff}.ghost{color:#dce8f7;background:rgba(255,255,255,.06);border:1px solid rgba(124,179,241,.14)}.hidden{display:none}.error{color:#ffb3b3;background:rgba(255,65,65,.08);border-color:rgba(255,65,65,.2)}
  </style>
</head>
<body>
<main>
  <img class="logo" src="assets/ayan-logo-v2.webp" alt="Ayan Photography">
  <div class="eyebrow">AYAN PHOTOGRAPHY</div>
  <div class="icon" id="icon">⌛</div>
  <h1 id="title">جاري التحقق من الدفع</h1>
  <p id="text">لحظات ونراجع العملية مباشرة مع Tap.</p>
  <div class="status" id="status">جاري التحقق…</div><div class="status hidden" id="breakdown"></div><div class="status hidden" id="emailStatus"></div>
  <div class="actions hidden" id="actions">
    <a class="primary" id="invoiceLink" href="#">تحميل الفاتورة PDF</a>
    <a class="ghost" id="whatsappLink" target="_blank" rel="noopener">التنسيق عبر واتساب</a>
    <a class="ghost" href="booking.html">العودة للحجز</a>
  </div>
</main>
<script>
const lang = localStorage.getItem('ayan_lang') === 'en' ? 'en' : 'ar';
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
const qs = new URLSearchParams(location.search);
const provider = qs.get('provider') === 'tabby' ? 'tabby' : qs.get('provider') === 'tamara' ? 'tamara' : 'tap';
const isTabby = provider === 'tabby';
const isTamara = provider === 'tamara';
const t = lang === 'ar'
  ? {
      checking:'جاري التحقق من الدفع',
      checkText:isTabby?'لحظات ونراجع العملية مباشرة مع تابي.':isTamara?'لحظات ونراجع العملية مباشرة مع تمارا.':'لحظات ونراجع العملية مباشرة مع Tap.',
      checkingStatus:'جاري التحقق…',
      success:'تم الدفع بنجاح 🎉',
      successText:'تم تأكيد دفعتك بنجاح. تقدر تحمل الفاتورة وتكمل التنسيق معنا.',
      paid:'تم تأكيد العملية.',
      failed:'لم يتم تأكيد الدفع بعد.',
      failedText:'ارجع للحجز وحاول مرة ثانية إذا لم تكتمل العملية.',
      invoice:'تحميل الفاتورة PDF',
      wa:'التنسيق عبر واتساب',
      back:'العودة للحجز',
      error:'تعذر التحقق من عملية الدفع.'
    }
  : {
      checking:'Verifying payment',
      checkText:isTabby?'One moment while we verify the payment with Tabby.':'One moment while we verify the transaction with Tap.',
      checkingStatus:'Verifying…',
      success:'Payment confirmed 🎉',
      successText:'Your payment has been confirmed. You can download the invoice and continue coordination.',
      paid:'Payment captured successfully.',
      failed:'Payment is not confirmed yet.',
      failedText:'Return to booking and try again if the payment did not complete.',
      invoice:'Download PDF invoice',
      wa:'Continue on WhatsApp',
      back:'Back to booking',
      error:'We could not verify the payment.'
    };
document.getElementById('title').textContent=t.checking;
document.getElementById('text').textContent=t.checkText;
document.getElementById('status').textContent=t.checkingStatus;
document.getElementById('invoiceLink').textContent=t.invoice;
document.getElementById('whatsappLink').textContent=t.wa;
const paymentId = isTabby
  ? (qs.get('payment_id') || sessionStorage.getItem('ayan_tabby_payment_id') || '')
  : isTamara
    ? (qs.get('order_id') || qs.get('payment_id') || sessionStorage.getItem('ayan_tamara_order_id') || '')
    : (qs.get('tap_id') || '');
const statusNode=document.getElementById('status');
const icon=document.getElementById('icon');
const actions=document.getElementById('actions');
const invoiceLink=document.getElementById('invoiceLink');
const whatsappLink=document.getElementById('whatsappLink');
const breakdown=document.getElementById('breakdown');
async function verify(attempt=0){
  if(qs.get('result') === 'cancel' || qs.get('result') === 'failure'){
    icon.textContent='!';
    document.getElementById('title').textContent=t.failed;
    document.getElementById('text').textContent=t.failedText;
    statusNode.textContent=qs.get('result')==='cancel'?'تم إلغاء عملية الدفع.':'تعذرت عملية الدفع.';
    statusNode.classList.add('error');
    actions.classList.remove('hidden');
    invoiceLink.classList.add('hidden');
    whatsappLink.classList.add('hidden');
    return;
  }
  if(!paymentId){
    icon.textContent='!';
    statusNode.textContent=t.error;
    statusNode.classList.add('error');
    return;
  }
  try{
    const endpoint=isTabby?'/api/tabby-payment?payment_id=':isTamara?'/api/tamara-payment?order_id=':'/api/payment?tap_id=';
    const r=await fetch(endpoint+encodeURIComponent(paymentId),{cache:'no-store'});
    const data=await r.json();
    const success=isTabby ? data.success && data.status==='CLOSED' : isTamara ? data.success && ['APPROVED','AUTHORISED','FULLY_CAPTURED','PARTIALLY_CAPTURED'].includes(String(data.status||'').toUpperCase().replace(/\s+/g,'_')) : data.success && data.status==='CAPTURED';
    if(success){
      icon.textContent='✓';
      document.getElementById('title').textContent=t.success;
      document.getElementById('text').textContent=t.successText;
      statusNode.textContent=`${t.paid} ${Number(data.amount||data.total||0).toFixed(2)} SAR`;
      breakdown.innerHTML=lang==='ar'
        ? `سعر الباقة: <b>${Number(data.subtotal||0).toFixed(2)} SAR</b> &nbsp; • &nbsp; رسوم الدفع: <b>${Number(data.paymentFee||data.serviceFee||0).toFixed(2)} SAR</b> &nbsp; • &nbsp; الإجمالي: <b>${Number(data.total||data.amount||0).toFixed(2)} SAR</b>`
        : `Package: <b>${Number(data.subtotal||0).toFixed(2)} SAR</b> &nbsp; • &nbsp; Payment fee: <b>${Number(data.paymentFee||data.serviceFee||0).toFixed(2)} SAR</b> &nbsp; • &nbsp; Total: <b>${Number(data.total||data.amount||0).toFixed(2)} SAR</b>`;
      breakdown.classList.remove('hidden');
      invoiceLink.href=isTabby?'/invoice.html?provider=tabby&payment_id='+encodeURIComponent(paymentId):isTamara?'/invoice.html?provider=tamara&order_id='+encodeURIComponent(paymentId):'/invoice.html?tap_id='+encodeURIComponent(paymentId);
      const business='966565117739';
      const msg=lang==='ar'?`السلام عليكم، تم الدفع للحجز\n- الاسم: ${data.customerName||''}\n- الباقة: ${data.packageName||''}\n- طريقة الدفع: ${isTabby?'تابي':isTamara?'تمارا':'بطاقة'}\n- الإجمالي: ${Number(data.amount||0).toFixed(2)} ريال\n- رقم العملية: ${data.paymentId||data.tapId||paymentId}`:`Hello, my booking payment is completed\n- Name: ${data.customerName||''}\n- Package: ${data.packageName||''}\n- Payment method: ${isTabby?'Tabby':isTamara?'Tamara':'Card'}\n- Total: ${Number(data.amount||0).toFixed(2)} SAR\n- Payment ID: ${data.paymentId||data.tapId||paymentId}`;
      whatsappLink.href='https://wa.me/'+business+'?text='+encodeURIComponent(msg);
      actions.classList.remove('hidden');
      void sendPdfInvoice(provider, paymentId, data);
      void sendWhatsAppConfirmation(provider, paymentId, data);
      sessionStorage.removeItem('ayan_tabby_payment_id');
      sessionStorage.removeItem('ayan_tamara_order_id');
      return;
    }
    if(attempt<8){
      statusNode.textContent=(data.status||'').toUpperCase()||t.checkingStatus;
      setTimeout(()=>verify(attempt+1),2500);
      return;
    }
    icon.textContent='!';
    document.getElementById('title').textContent=t.failed;
    document.getElementById('text').textContent=t.failedText;
    statusNode.textContent=data.status||t.failed;
    statusNode.classList.add('error');
    actions.classList.remove('hidden');
    invoiceLink.classList.add('hidden');
    whatsappLink.classList.add('hidden');
  }catch(e){
    if(attempt<4){setTimeout(()=>verify(attempt+1),2500);return;}
    icon.textContent='!';
    statusNode.textContent=t.error;
    statusNode.classList.add('error');
  }
}

const emailStatus=document.getElementById('emailStatus');
async function sendInvoiceEmail(providerValue, paymentRef){
  if(!paymentRef || !emailStatus) return;
  try{
    const r=await fetch('/api/send-invoice-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:providerValue,paymentId:paymentRef})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.success){
      emailStatus.textContent=lang==='ar'?'📧 تم إرسال الفاتورة إلى بريدك الإلكتروني.':'📧 Your invoice has been sent to your email.';
    }else{
      emailStatus.textContent=lang==='ar'?'تم تأكيد الدفع. يمكنك تحميل الفاتورة من الزر أعلاه.':'Payment is confirmed. You can download the invoice using the button above.';
    }
    emailStatus.classList.remove('hidden');
  }catch(_){
    emailStatus.textContent=lang==='ar'?'تم تأكيد الدفع. يمكنك تحميل الفاتورة من الزر أعلاه.':'Payment is confirmed. You can download the invoice using the button above.';
    emailStatus.classList.remove('hidden');
  }
}

async function sendWhatsAppConfirmation(providerValue, paymentRef, bookingData = {}){
  if(!paymentRef || !emailStatus) return;
  const key=`ayan_whatsapp_sent_${providerValue}_${paymentRef}`;
  if(sessionStorage.getItem(key)==='1') return;
  try{
    const r=await fetch('/api/send-whatsapp-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:providerValue,paymentId:paymentRef,details:{customerName:bookingData.customerName||'',email:bookingData.email||'',phone:bookingData.phone||'',packageName:bookingData.packageName||'',packageNameAr:bookingData.packageNameAr||'',packageNameEn:bookingData.packageNameEn||'',carType:bookingData.carType||'',shootRegion:bookingData.shootRegion||'',notes:bookingData.notes||'',termsAccepted:bookingData.termsAccepted===true,termsAcceptedAt:bookingData.termsAcceptedAt||'',lang:bookingData.lang==='en'?'en':'ar'}})});
    const d=await r.json().catch(()=>({}));
    if(r.ok && d.sent){
      sessionStorage.setItem(key,'1');
      emailStatus.textContent=lang==='ar'
        ? '✅ تم إرسال رسالة تأكيد الحجز إلى واتساب.'
        : '✅ Your booking confirmation was sent to WhatsApp.';
      emailStatus.classList.remove('hidden');
    }
  }catch(error){
    console.error('WhatsApp confirmation failed',error);
  }
}
async function sendPdfInvoice(providerValue, paymentRef, bookingData = {}){
  if(!paymentRef || !emailStatus) return;
  const key=`ayan_pdf_sent_${providerValue}_${paymentRef}`;
  if(sessionStorage.getItem(key)==='1') return;

  emailStatus.textContent=lang==='ar'?'جاري تجهيز وإرسال الفاتورة PDF…':'Preparing and sending your PDF invoice…';
  emailStatus.classList.remove('hidden');

  let iframe;
  try{
    const invoiceUrl=providerValue==='tabby'
      ? '/invoice.html?provider=tabby&payment_id='+encodeURIComponent(paymentRef)+'&embed=1'
      : providerValue==='tamara'
        ? '/invoice.html?provider=tamara&order_id='+encodeURIComponent(paymentRef)+'&embed=1'
        : '/invoice.html?tap_id='+encodeURIComponent(paymentRef)+'&embed=1';

    iframe=document.createElement('iframe');
    iframe.style.position='fixed';
    iframe.style.left='-10000px';
    iframe.style.top='0';
    iframe.style.width='900px';
    iframe.style.height='1400px';
    iframe.style.border='0';
    iframe.setAttribute('aria-hidden','true');
    document.body.appendChild(iframe);

    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('Invoice load timeout')),20000);
      iframe.onload=()=>{clearTimeout(timer);resolve()};
      iframe.onerror=()=>{clearTimeout(timer);reject(new Error('Invoice load failed'))};
      iframe.src=invoiceUrl;
    });

    if(iframe.contentWindow.invoiceReady){
      await Promise.race([
        iframe.contentWindow.invoiceReady,
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('Invoice data timeout')),20000))
      ]);
    }

    await new Promise(r=>setTimeout(r,300));
    const invoiceNo=iframe.contentDocument?.querySelector('.invoice-meta .ref')?.textContent?.replace(/^.*?:\s*/,'').trim() || `AYAN-${paymentRef}`;
    if(typeof iframe.contentWindow.generateInvoicePdfBlob!=='function') throw new Error('Invoice PDF generator unavailable');

    const blob=await iframe.contentWindow.generateInvoicePdfBlob(invoiceNo);
    const base64=await blobToBase64(blob);
    const r=await fetch('/api/send-invoice-pdf',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        provider:providerValue,
        paymentId:paymentRef,
        pdfBase64:base64,
        details:{
          customerName:bookingData.customerName||'',
          email:bookingData.email||'',
          phone:bookingData.phone||'',
          packageName:bookingData.packageName||'',
          packageNameAr:bookingData.packageNameAr||'',
          packageNameEn:bookingData.packageNameEn||'',
          carType:bookingData.carType||'',
          shootRegion:bookingData.shootRegion||'',
          notes:bookingData.notes||'',
          termsAccepted:bookingData.termsAccepted===true,
          termsAcceptedAt:bookingData.termsAcceptedAt||'',
          lang:bookingData.lang==='en'?'en':'ar'
        }
      })
    });

    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'PDF delivery failed');

    const emailOk=Boolean(d.emailSent);
    const discordOk=Boolean(d.discordSent);
    if(emailOk && discordOk) sessionStorage.setItem(key,'1');

    if(lang==='ar'){
      if(emailOk && discordOk){
        emailStatus.textContent='📧 تم إرسال الفاتورة PDF إلى البريد وDiscord.';
      }else if(emailOk){
        emailStatus.textContent='📧 تم إرسال الفاتورة PDF إلى بريدك الإلكتروني.';
      }else if(discordOk){
        emailStatus.textContent='💬 تم إرسال الفاتورة إلى Discord، ويمكنك تحميل PDF من الزر أعلاه.';
      }else{
        emailStatus.textContent='تم تأكيد الدفع، ويمكنك تحميل الفاتورة PDF من الزر أعلاه.';
      }
    }else{
      if(emailOk && discordOk){
        emailStatus.textContent='📧 The PDF invoice was sent by email and to Discord.';
      }else if(emailOk){
        emailStatus.textContent='📧 The PDF invoice was sent to your email.';
      }else if(discordOk){
        emailStatus.textContent='💬 The invoice was sent to Discord. You can download the PDF above.';
      }else{
        emailStatus.textContent='Payment confirmed. You can download the PDF invoice above.';
      }
    }
    emailStatus.classList.remove('hidden');
  }catch(error){
    console.error('PDF invoice delivery failed',error);
    emailStatus.textContent=lang==='ar'
      ? 'تم تأكيد الدفع. يمكنك تحميل الفاتورة PDF من الزر أعلاه.'
      : 'Payment is confirmed. You can download the PDF invoice above.';
    emailStatus.classList.remove('hidden');
  }finally{
    if(iframe) iframe.remove();
  }
}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=reject;reader.readAsDataURL(blob)})}
verify();
</script>
</body>
</html>
